[alembic]
script_location = %(here)s/migrations
# Файлы называются по номеру ревизии: 0001_initial_schema.py, 0002_...
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
# URL базы берётся из DATABASE_URL (app.config), здесь не дублируется.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

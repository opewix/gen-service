<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gen·service</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%237c5cff'/><circle cx='16' cy='16' r='6' fill='white'/></svg>">
<style>
  :root {
    --bg: #f6f6f9;
    --surface: #ffffff;
    --surface-2: #f1f1f6;
    --border: #e4e4ec;
    --text: #17171f;
    --muted: #6b6b7b;
    --faint: #a0a0b0;
    --accent: #6d4aff;
    --accent-soft: #6d4aff1a;
    --accent-text: #ffffff;
    --ok: #12a150;
    --ok-soft: #12a1501a;
    --run: #2f6bff;
    --run-soft: #2f6bff1a;
    --bad: #e5484d;
    --bad-soft: #e5484d1a;
    --warn: #c27c0e;
    --warn-soft: #c27c0e1f;
    --shadow: 0 1px 2px #0000000a, 0 8px 24px #0000000d;
    --radius: 14px;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d12;
      --surface: #16161d;
      --surface-2: #1d1d26;
      --border: #2a2a36;
      --text: #ececf3;
      --muted: #9a9aab;
      --faint: #5f5f70;
      --accent: #8b70ff;
      --accent-soft: #8b70ff24;
      --ok: #3dd68c;
      --ok-soft: #3dd68c1f;
      --run: #6b9bff;
      --run-soft: #6b9bff1f;
      --bad: #ff6369;
      --bad-soft: #ff63691f;
      --warn: #f1a10d;
      --warn-soft: #f1a10d1f;
      --shadow: 0 1px 2px #00000040, 0 8px 24px #00000040;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .muted { color: var(--muted); }

  /* ── шапка ── */
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 14px max(16px, calc((100vw - 1200px) / 2));
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; letter-spacing: -0.01em; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 8px;
    background: conic-gradient(from 200deg, var(--accent), #ff7ab6, #ffb84d, var(--accent));
    position: relative;
  }
  .brand-mark::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--surface); }
  .brand small { color: var(--muted); font-weight: 450; }
  .spacer { flex: 1; }

  .user {
    display: flex; align-items: center; gap: 6px;
    padding: 4px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
  }
  .user label { padding-left: 10px; color: var(--muted); font-size: 13px; }
  .user input {
    width: 72px; border: 0; background: transparent; outline: none; font-family: var(--mono); font-size: 13px;
  }
  .chip {
    border: 0; background: var(--surface-2); border-radius: 999px; padding: 4px 10px; font-size: 13px;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }

  .wallet { display: flex; align-items: center; gap: 12px; }
  .balance { text-align: right; line-height: 1.1; }
  .balance b { font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; transition: color .3s; }
  .balance b.flash-up { color: var(--ok); }
  .balance b.flash-down { color: var(--bad); }
  .balance span { display: block; font-size: 12px; color: var(--muted); }
  .topup { display: flex; gap: 4px; }
  .topup button {
    border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 6px 10px;
    font-weight: 550; font-variant-numeric: tabular-nums;
  }
  .topup button:hover { border-color: var(--accent); color: var(--accent); }
  .dup { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }

  /* ── раскладка ── */
  main {
    display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 20px; align-items: start;
    padding: 20px max(16px, calc((100vw - 1200px) / 2)) 48px;
  }
  .stack { display: grid; gap: 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card > h2 {
    margin: 0; padding: 16px 18px 0; font-size: 13px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: 8px;
  }
  .card-body { padding: 14px 18px 18px; }
  @media (max-width: 900px) {
    main { grid-template-columns: minmax(0, 1fr); }
    /* На узком экране: заказ, затем задачи, журнал в конце. */
    .stack { display: contents; }
    #ledger-card { order: 3; }
  }
  @media (max-width: 560px) {
    .brand small, .dup span, .user label { display: none; }
    .user input { padding-left: 10px; }
    .user input { width: 44px; }
    header { gap: 12px; }
  }

  /* ── форма заказа ── */
  .models { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .model {
    text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 10px 12px;
    transition: border-color .15s, background .15s;
  }
  .model[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .model b { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .model span { color: var(--muted); font-size: 12px; }

  .route { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 12px 0 2px; }
  .leg {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 8px;
    background: var(--surface-2); font-size: 12px; transition: opacity .2s;
  }
  .leg.off { opacity: .38; text-decoration: line-through; }
  .leg .tag { color: var(--warn); }
  .arrow { color: var(--faint); font-size: 12px; }
  .hint { font-size: 12px; color: var(--muted); min-height: 18px; margin-top: 4px; }
  .hint.bad { color: var(--bad); }

  .field { display: grid; gap: 6px; margin-top: 14px; }
  .field > span { font-size: 12px; color: var(--muted); font-weight: 550; }
  textarea, .ref input {
    width: 100%; border: 1px solid var(--border); background: var(--surface-2); border-radius: 10px;
    padding: 10px 12px; outline: none; transition: border-color .15s, background .15s;
  }
  textarea { min-height: 84px; resize: vertical; }
  textarea:focus, .ref input:focus { border-color: var(--accent); background: var(--surface); }
  .refs { display: grid; gap: 6px; }
  .ref { display: flex; gap: 6px; }
  .ref input { padding: 7px 10px; font-family: var(--mono); font-size: 12px; }
  .icon-btn {
    flex: none; width: 32px; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; color: var(--muted);
  }
  .icon-btn:hover { color: var(--bad); border-color: var(--bad); }
  .ghost {
    border: 1px dashed var(--border); background: transparent; border-radius: 10px; padding: 7px; color: var(--muted); font-size: 13px;
  }
  .ghost:hover { border-color: var(--accent); color: var(--accent); }
  .primary {
    width: 100%; margin-top: 16px; border: 0; border-radius: 12px; padding: 12px;
    background: var(--accent); color: var(--accent-text); font-weight: 600; font-size: 15px;
    box-shadow: 0 6px 18px -6px var(--accent); transition: transform .1s, opacity .15s;
  }
  .primary:active { transform: translateY(1px); }
  .primary:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

  /* ── журнал ── */
  .ledger { list-style: none; margin: 0; padding: 0; }
  .ledger li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 0; border-top: 1px solid var(--border); }
  .ledger li:first-child { border-top: 0; }
  .ledger .amt { font-weight: 650; font-variant-numeric: tabular-nums; text-align: right; }
  .amt.plus { color: var(--ok); }
  .amt.minus { color: var(--text); }
  .ledger .sub { grid-column: 1 / -1; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── задачи ── */
  .tasks-head { display: flex; align-items: center; gap: 10px; padding: 0 2px 12px; }
  .tasks-head h1 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .live.on i { background: var(--ok); animation: pulse 1.4s ease-in-out infinite; }
  .tasks { display: grid; gap: 12px; }
  .task { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 16px; padding: 14px; animation: rise .35s ease-out; }
  @media (max-width: 560px) { .task { grid-template-columns: 76px minmax(0, 1fr); gap: 12px; padding: 12px; } .art .kind { display: none; } }

  .art {
    position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--surface-2);
    display: grid; place-items: center; color: #fff;
  }
  .art.video { aspect-ratio: 16 / 11; align-self: start; }
  .art .glyph { position: relative; z-index: 1; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: #00000040; backdrop-filter: blur(4px); font-size: 14px; }
  .art .kind { position: absolute; left: 8px; bottom: 6px; z-index: 1; font-size: 11px; font-weight: 600; letter-spacing: .04em; opacity: .9; }
  .art.wait::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(110deg, transparent 30%, color-mix(in srgb, var(--accent) 22%, transparent) 50%, transparent 70%);
    background-size: 220% 100%; animation: shimmer 1.6s linear infinite;
  }
  .art.fail { background: var(--bad-soft); color: var(--bad); }
  .art.fail .glyph { background: transparent; font-size: 22px; }

  .task-main { min-width: 0; display: grid; gap: 8px; align-content: start; }
  .task-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .prompt { font-weight: 550; font-size: 15px; overflow-wrap: anywhere; }
  .meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .s-pending { color: var(--muted); background: var(--surface-2); }
  .s-running { color: var(--run); background: var(--run-soft); }
  .s-running::before { animation: pulse 1.2s ease-in-out infinite; }
  .s-completed { color: var(--ok); background: var(--ok-soft); }
  .s-failed { color: var(--bad); background: var(--bad-soft); }

  .attempts { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .att { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 8px; font-size: 12px; border: 1px solid var(--border); }
  .att .p { font-weight: 650; }
  .att.a-completed { border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); }
  .att.a-failed, .att.a-timed_out { border-color: color-mix(in srgb, var(--bad) 40%, var(--border)); }
  .att.a-cancelled { opacity: .55; }
  .att .why { color: var(--muted); }
  .late { color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 0 6px; font-weight: 600; }

  .result { display: flex; align-items: center; gap: 8px; font-size: 12px; min-width: 0; }
  .result a { color: var(--accent); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); }
  .result a:hover { text-decoration: underline; }
  .note { font-size: 12px; padding: 6px 10px; border-radius: 8px; }
  .note.refund { background: var(--ok-soft); color: var(--ok); }
  .note.warn { background: var(--warn-soft); color: var(--warn); }

  .empty { text-align: center; padding: 56px 20px; color: var(--muted); }
  .empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }

  /* ── уведомления ── */
  .toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 50; max-width: min(380px, calc(100vw - 32px)); }
  .toast {
    padding: 11px 14px; border-radius: 12px; background: var(--text); color: var(--bg); box-shadow: var(--shadow);
    font-size: 13px; animation: rise .25s ease-out;
  }
  .toast.bad { background: var(--bad); color: #fff; }
  .toast.ok { background: var(--ok); color: #fff; }

  @keyframes pulse { 50% { opacity: .35; } }
  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="brand-mark" aria-hidden="true"></div>gen·service <small>генерация</small></div>
  <div class="spacer"></div>
  <div class="user" role="group" aria-label="Пользователь">
    <label for="user-id">user</label>
    <input id="user-id" type="number" min="1" inputmode="numeric">
    <button class="chip" data-user="1">1</button>
    <button class="chip" data-user="2">2</button>
    <button class="chip" data-user="3">3</button>
  </div>
  <div class="wallet">
    <div class="balance"><b id="balance">—</b><span>токенов</span></div>
    <div class="topup" aria-label="Пополнить">
      <button data-tokens="10">+10</button>
      <button data-tokens="50">+50</button>
      <button data-tokens="100">+100</button>
    </div>
    <label class="dup" title="Платёжка пришлёт один и тот же вебхук 5 раз одновременно — начисление всё равно одно">
      <input id="dup" type="checkbox"> <span>×5 вебхуков</span>
    </label>
  </div>
</header>

<main>
  <div class="stack">
    <section class="card" aria-labelledby="order-title">
      <h2 id="order-title">Новый заказ</h2>
      <form class="card-body" id="order">
        <div class="models" id="models" role="group" aria-label="Модель"></div>
        <div class="route" id="route" aria-label="Цепочка провайдеров"></div>
        <div class="hint" id="route-hint"></div>

        <label class="field">
          <span>Промпт</span>
          <textarea id="prompt" required placeholder="Кот-астронавт на фоне туманности, кинематографичный свет">Кот-астронавт на фоне туманности, кинематографичный свет</textarea>
        </label>

        <div class="field">
          <span>Референсы <span class="muted" id="ref-count"></span></span>
          <div class="refs" id="refs"></div>
          <button type="button" class="ghost" id="add-ref">+ добавить референс</button>
        </div>

        <button class="primary" id="submit" type="submit">Сгенерировать</button>
      </form>
    </section>

    <section class="card" id="ledger-card" aria-labelledby="ledger-title">
      <h2 id="ledger-title">Журнал операций</h2>
      <div class="card-body"><ul class="ledger" id="ledger"></ul></div>
    </section>
  </div>

  <section aria-labelledby="tasks-title">
    <div class="tasks-head">
      <h1 id="tasks-title">Задачи</h1>
      <span class="live" id="live"><i></i><span>обновляется</span></span>
    </div>
    <div class="tasks" id="tasks" aria-live="polite"></div>
  </section>
</main>

<div class="toasts" id="toasts" aria-live="assertive"></div>

<script>
// Порт фейковой платёжки из docker-compose: она подписывает вебхук оплаты за браузер.
const PAYMENTS_URL = `${location.protocol}//${location.hostname}:8003`;
const POLL_ACTIVE_MS = 1500;
const POLL_IDLE_MS = 6000;
const ACTIVE = new Set(["pending", "running"]);

const $ = (id) => document.getElementById(id);
const state = {
  userId: Number(load("userId")) || 1,
  models: [],
  model: load("model") || "image-fast",
  refs: [],
  tasks: [],
  balance: null,
  userExists: true,
  burstUntil: 0,       // после действий пользователя чаще опрашиваем
  rendered: new Map(), // id задачи → отпечаток последней отрисовки
};

function load(key) { try { return localStorage.getItem(key); } catch { return null; } }
function save(key, value) { try { localStorage.setItem(key, value); } catch {} }
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

async function api(path, options = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  let data = null;
  try { data = await res.json(); } catch {}
  return { ok: res.ok, status: res.status, data };
}

function toast(text, kind = "") {
  const el = document.createElement("div");
  el.className = `toast ${kind}`;
  el.textContent = text;
  $("toasts").append(el);
  setTimeout(() => el.remove(), 4200);
}

// ── пользователь и баланс ──
function setUser(id) {
  if (!Number.isInteger(id) || id < 1) return;
  state.userId = id;
  state.rendered.clear();
  $("tasks").innerHTML = "";
  save("userId", id);
  $("user-id").value = id;
  document.querySelectorAll("[data-user]").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.user) === id)));
  state.balance = null;
  refresh();
}

function renderBalance(balance) {
  const el = $("balance");
  if (balance === null) { el.textContent = "—"; return; }
  if (state.balance !== null && balance !== state.balance) {
    el.classList.remove("flash-up", "flash-down");
    void el.offsetWidth;
    el.classList.add(balance > state.balance ? "flash-up" : "flash-down");
    setTimeout(() => el.classList.remove("flash-up", "flash-down"), 900);
  }
  el.textContent = balance;
}

const KIND = { payment: "Пополнение", charge: "Списание", refund: "Возврат" };
function renderLedger(entries) {
  const list = $("ledger");
  if (!state.userExists) {
    list.innerHTML = `<li class="muted">Пользователя ещё нет — пополните баланс, и он появится.</li>`;
    return;
  }
  if (!entries.length) { list.innerHTML = `<li class="muted">Операций пока нет.</li>`; return; }
  list.innerHTML = entries.map((e) => `
    <li>
      <span>${KIND[e.kind] ?? e.kind}</span>
      <span class="amt ${e.amount > 0 ? "plus" : "minus"}">${e.amount > 0 ? "+" : "−"}${Math.abs(e.amount)}</span>
      <span class="sub">${time(e.created_at)} · <span class="mono">${esc(e.task_id ? "задача " + e.task_id.slice(0, 8) : e.payment_id)}</span></span>
    </li>`).join("");
}

// ── форма заказа ──
async function loadModels() {
  const { ok, data } = await api("/models");
  if (!ok) return;
  state.models = data;
  if (!data.some((m) => m.slug === state.model)) state.model = data[0]?.slug;
  renderModels();
}

function currentModel() { return state.models.find((m) => m.slug === state.model); }

function renderModels() {
  $("models").innerHTML = state.models.map((m) => `
    <button type="button" class="model" data-model="${esc(m.slug)}" aria-pressed="${m.slug === state.model}">
      <b>${m.slug.startsWith("video") ? "▶" : "◼"} ${esc(m.slug)}</b>
      <span>${m.price} ${plural(m.price, "токен", "токена", "токенов")}</span>
    </button>`).join("");
  renderRoute();
}

function renderRoute() {
  const model = currentModel();
  if (!model) return;
  const n = state.refs.length;
  $("route").innerHTML = model.legs.map((leg, i) => `
    ${i ? '<span class="arrow">→</span>' : ""}
    <span class="leg ${n > leg.max_ref_images ? "off" : ""}" title="${n > leg.max_ref_images ? "не принимает столько референсов" : ""}">
      <b>${esc(leg.provider)}</b> до ${leg.max_ref_images}
      ${leg.skip_on_moderation ? '<span class="tag" title="Пропускается, если ранее был отказ модерации">skip mod</span>' : ""}
    </span>`).join("");
  const fits = model.legs.some((leg) => n <= leg.max_ref_images);
  const hint = $("route-hint");
  hint.textContent = fits ? "При отказе задача сама уйдёт к следующему провайдеру." : "Ни один провайдер не примет столько референсов.";
  hint.classList.toggle("bad", !fits);
  $("ref-count").textContent = n ? `· ${n}` : "";
  $("submit").textContent = `Сгенерировать · ${model.price} ${plural(model.price, "токен", "токена", "токенов")}`;
  $("submit").disabled = !fits;
}

function renderRefs() {
  $("refs").innerHTML = state.refs.map((url, i) => `
    <div class="ref">
      <input value="${esc(url)}" data-ref="${i}" aria-label="Референс ${i + 1}">
      <button type="button" class="icon-btn" data-remove="${i}" aria-label="Убрать">✕</button>
    </div>`).join("");
  renderRoute();
}

async function submitOrder(event) {
  event.preventDefault();
  const prompt = $("prompt").value.trim();
  if (!prompt) { toast("Напишите промпт", "bad"); return; }
  $("submit").disabled = true;
  const { ok, status, data } = await api("/generate", {
    method: "POST",
    body: JSON.stringify({ user_id: state.userId, model_slug: state.model, prompt, ref_images: state.refs.filter(Boolean) }),
  });
  renderRoute();
  if (ok) {
    burst();
    await refresh();
    return;
  }
  const messages = {
    402: "Не хватает токенов — пополните баланс.",
    429: "Уже 3 активные задачи. Дождитесь, пока какая-нибудь завершится.",
    400: "Ни один провайдер не принимает столько референсов.",
    404: data?.detail === "user not found" ? "Пользователя нет — пополните баланс, и он появится." : "Модель не найдена.",
  };
  toast(messages[status] ?? `Ошибка ${status}`, "bad");
}

async function topUp(tokens) {
  const duplicates = $("dup").checked ? 5 : 1;
  try {
    const res = await fetch(`${PAYMENTS_URL}/checkout`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: state.userId, tokens, duplicates }),
    });
    if (!res.ok) throw new Error(res.status);
    toast(duplicates > 1 ? `Оплата +${tokens}: платёжка пришлёт 5 одинаковых вебхуков` : `Оплата +${tokens} отправлена`);
    burst(5000);
  } catch {
    toast("Платёжка недоступна (порт 8003)", "bad");
  }
}

// ── задачи ──
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

function artStyle(id) {
  const h = hash(id), a = h % 360, b = (a + 70 + (h >> 9) % 140) % 360, x = 20 + (h >> 4) % 50, y = 20 + (h >> 12) % 50;
  return `background:
    radial-gradient(circle at ${x}% ${y}%, hsl(${a} 90% 68%), transparent 55%),
    radial-gradient(circle at ${100 - x}% ${100 - y / 2}%, hsl(${b} 85% 58%), transparent 60%),
    linear-gradient(135deg, hsl(${a} 55% 22%), hsl(${b} 60% 32%))`;
}

const STATUS = { pending: "в очереди", running: "генерируется", completed: "готово", failed: "не удалось" };
const ATTEMPT = { pending: "ждёт", dispatching: "отправка", submitted: "в работе", completed: "готово", failed: "отказ", timed_out: "таймаут", cancelled: "снята" };
const ERROR = { technical: "техническая", moderation: "модерация", payload: "неверный запрос" };

function art(task) {
  const video = task.model_slug.startsWith("video");
  const cls = `art ${video ? "video" : ""}`;
  if (task.status === "completed") {
    return `<div class="${cls}" style="${artStyle(task.id)}"><span class="glyph">${video ? "▶" : "✦"}</span><span class="kind">${video ? "VIDEO" : "IMAGE"}</span></div>`;
  }
  if (task.status === "failed") return `<div class="${cls} fail"><span class="glyph">✕</span></div>`;
  return `<div class="${cls} wait"></div>`;
}

function attempts(task) {
  return task.attempts.map((a, i) => `
    ${i ? '<span class="arrow">→</span>' : ""}
    <span class="att a-${a.status}" title="${esc(a.error_detail ?? "")}">
      <span class="p">${esc(a.provider)}</span>
      <span>${ATTEMPT[a.status] ?? a.status}</span>
      ${a.error_type ? `<span class="why">· ${ERROR[a.error_type] ?? a.error_type}</span>` : ""}
      ${a.late_result_at ? '<span class="late" title="completed пришёл после того, как сторож перестал ждать">поздно</span>' : ""}
    </span>`).join("");
}

function notes(task) {
  const late = task.attempts.find((a) => a.late_result_at);
  const out = [];
  if (task.status === "failed") {
    out.push(`<div class="note refund">Токены возвращены${task.error_type ? ` · причина: ${ERROR[task.error_type] ?? task.error_type}` : ""}</div>`);
    if (late) out.push(`<div class="note warn">Результат пришёл после возврата — не выдан, чтобы не было и результата, и возврата.</div>`);
  } else if (task.status === "completed" && late) {
    out.push(`<div class="note warn">Результат пришёл с опозданием от ${esc(late.provider)}, но раньше следующей ноги — выдан без возврата.</div>`);
  }
  return out.join("");
}

function taskHtml(task) {
  const active = ACTIVE.has(task.status);
  const finished = task.attempts.at(-1)?.finished_at;
  return `
    ${art(task)}
    <div class="task-main">
      <div class="task-top">
        <span class="badge s-${task.status}">${STATUS[task.status] ?? task.status}</span>
        ${active && task.current_provider ? `<span class="muted">у ${esc(task.current_provider)}</span>` : ""}
      </div>
      <div class="prompt">${esc(task.prompt)}</div>
      <div class="meta">
        <span>${esc(task.model_slug)}</span>
        <span>${time(task.created_at)}</span>
        ${active ? `<span data-since="${task.created_at}">${elapsed(task.created_at)}</span>`
                 : finished ? `<span>за ${duration(task.created_at, finished)}</span>` : ""}
        ${task.ref_images.length ? `<span>${task.ref_images.length} реф.</span>` : ""}
        <span class="mono" title="${task.id}">${task.id.slice(0, 8)}</span>
      </div>
      <div class="attempts">${attempts(task)}</div>
      ${task.result_url ? `<div class="result">↳ <a href="${esc(task.result_url)}" target="_blank" rel="noopener">${esc(task.result_url)}</a></div>` : ""}
      ${notes(task)}
    </div>`;
}

function renderTasks(tasks) {
  const box = $("tasks");
  if (!tasks.length) {
    state.rendered.clear();
    box.innerHTML = `<div class="card empty"><b>Здесь появятся задачи</b>Пополните баланс и отправьте первый заказ.</div>`;
    return;
  }
  box.querySelector(".empty")?.remove();
  const ids = new Set(tasks.map((t) => t.id));
  for (const el of [...box.children]) if (!ids.has(el.dataset.id)) { el.remove(); state.rendered.delete(el.dataset.id); }

  // Перерисовываем только изменившиеся карточки, чтобы анимации не дёргались при каждом опросе.
  let prev = null;
  for (const task of tasks) {
    const print = JSON.stringify(task);
    let el = box.querySelector(`[data-id="${task.id}"]`);
    if (!el) {
      el = document.createElement("article");
      el.className = "card task";
      el.dataset.id = task.id;
      prev ? prev.after(el) : box.prepend(el);
    }
    if (state.rendered.get(task.id) !== print) {
      el.innerHTML = taskHtml(task);
      state.rendered.set(task.id, print);
    }
    prev = el;
  }
}

// ── время ──
function time(iso) { return new Date(iso).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit", second: "2-digit" }); }
function secs(ms) { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? `${s} с` : `${Math.floor(s / 60)} мин ${s % 60} с`; }
function elapsed(iso) { return `идёт ${secs(Date.now() - new Date(iso))}`; }
function duration(a, b) { return secs(new Date(b) - new Date(a)); }
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many;
}
setInterval(() => document.querySelectorAll("[data-since]").forEach((el) => { el.textContent = elapsed(el.dataset.since); }), 1000);

// ── опрос ──
let timer = null;
function burst(ms = 4000) { state.burstUntil = Date.now() + ms; schedule(0); }

async function refresh() {
  const userId = state.userId;
  const [balance, tasks] = await Promise.all([api(`/users/${userId}/balance`), api(`/users/${userId}/tasks`)]);
  if (userId !== state.userId) return; // пока ждали ответ, переключили пользователя
  state.userExists = balance.status !== 404;
  const newBalance = balance.ok ? balance.data.balance : null;
  if (state.balance !== null && newBalance !== null && newBalance > state.balance) {
    toast(`Зачислено +${newBalance - state.balance}`, "ok");
  }
  renderBalance(newBalance);
  state.balance = newBalance;
  renderLedger(balance.ok ? balance.data.ledger : []);
  state.tasks = tasks.ok ? tasks.data : [];
  renderTasks(state.tasks);
}

function isBusy() { return state.tasks.some((t) => ACTIVE.has(t.status)) || Date.now() < state.burstUntil; }

function schedule(delay) {
  clearTimeout(timer);
  timer = setTimeout(async () => {
    if (!document.hidden) { try { await refresh(); } catch {} }
    const busy = isBusy();
    $("live").classList.toggle("on", busy);
    schedule(busy ? POLL_ACTIVE_MS : POLL_IDLE_MS);
  }, delay);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) schedule(0); });

// ── события ──
$("user-id").addEventListener("change", (e) => setUser(Number(e.target.value)));
document.querySelectorAll("[data-user]").forEach((b) => b.addEventListener("click", () => setUser(Number(b.dataset.user))));
document.querySelectorAll("[data-tokens]").forEach((b) => b.addEventListener("click", () => topUp(Number(b.dataset.tokens))));
$("models").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-model]");
  if (!btn) return;
  state.model = btn.dataset.model;
  save("model", state.model);
  renderModels();
});
$("add-ref").addEventListener("click", () => { state.refs.push(`https://refs.example/ref-${state.refs.length + 1}.png`); renderRefs(); });
$("refs").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-remove]");
  if (!btn) return;
  state.refs.splice(Number(btn.dataset.remove), 1);
  renderRefs();
});
$("refs").addEventListener("input", (e) => { if (e.target.dataset.ref) state.refs[Number(e.target.dataset.ref)] = e.target.value; });
$("order").addEventListener("submit", submitOrder);

loadModels().then(() => setUser(state.userId));
schedule(POLL_ACTIVE_MS);
</script>
</body>
</html>
